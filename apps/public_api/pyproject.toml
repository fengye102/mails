[project]
name = "public-mail-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn[standard]", "pydantic-settings", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "alembic", "httpx", "cryptography"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/public_mail_api"]
